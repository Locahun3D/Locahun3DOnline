name: Deploy to Cloudflare

# morning-restored への push で自動ビルド＋D1マイグレ＋デプロイ。
# 手動実行(workflow_dispatch)も可。
on:
  push:
    branches: [morning-restored]
  workflow_dispatch:

# 同一ブランチの多重デプロイを防ぐ（後発が先発をキャンセル）。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # account_id は機密ではない（ダッシュボードURL等で公開情報）。API トークンのみ
      # GitHub Secrets に登録する。
      CLOUDFLARE_ACCOUNT_ID: 9ad06a76157fb2f40dfef1f4b7a14a93
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 品質ゲート（当面は非ブロッキング＝結果は見えるがデプロイは止めない）。
      # 安定したら continue-on-error を外して必須化する。
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test -- --passWithNoTests

      # Clerk keys/URLs must be inlined into the compiled Worker bundle, not
      # just visible to the build *process* — Next.js only performs that
      # inlining for vars it loads from a .env.production.local file, not for
      # vars set via the shell/CI `env:` block. Without this, CLERK_SECRET_KEY
      # resolves to undefined at Workers runtime (env.ts throws => every
      # request 500s), even though the build itself succeeds.
      #
      # The SIGN_IN/SIGN_UP_URL vars aren't secret (plain paths) but need the
      # same file-based inlining. Without them, auth.protect() falls back to
      # Clerk's hosted Account Portal (accounts.locahun3d.com) on protected
      # routes instead of staying on the app's own /sign-in page.
      - name: Write .env.production.local (Clerk keys)
        run: |
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" >> .env.production.local
          echo "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}" >> .env.production.local
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in" >> .env.production.local
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up" >> .env.production.local
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/dashboard" >> .env.production.local
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/dashboard" >> .env.production.local
          echo "NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}" >> .env.production.local

      # ここが本番デプロイの実ゲート: 型エラー/ビルド失敗ならデプロイしない。
      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply locahun3d-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
